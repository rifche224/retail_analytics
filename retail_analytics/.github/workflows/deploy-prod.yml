name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'

jobs:
  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://your-snowflake-account.snowflakecomputing.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==1.7.0

      - name: Install dbt packages
        run: |
          cd retail_analytics
          dbt deps

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          retail_analytics:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: dbt_prod
                threads: 16
          EOF

      - name: Backup current state
        run: |
          cd retail_analytics
          echo "📦 Creating backup of current production state..."
          dbt run-operation create_backup --target prod

      - name: Run dbt models
        run: |
          cd retail_analytics
          dbt run --target prod

      - name: Test dbt models
        run: |
          cd retail_analytics
          dbt test --target prod

      - name: Smoke tests
        run: |
          cd retail_analytics
          dbt test --select tag:smoke --target prod

      - name: Generate and upload documentation
        run: |
          cd retail_analytics
          dbt docs generate --target prod

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dbt-prod-artifacts
          path: |
            retail_analytics/target/manifest.json
            retail_analytics/target/catalog.json
            retail_analytics/target/run_results.json
          retention-days: 90

      - name: Create deployment tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG_NAME="prod-$(date +%Y%m%d-%H%M%S)"
          git tag -a $TAG_NAME -m "Production deployment $TAG_NAME"
          git push origin $TAG_NAME

      - name: Deployment summary
        run: |
          echo "✅ Deployment to PRODUCTION completed successfully"
          echo "📊 Environment: production"
          echo "🗄️ Schema: dbt_prod"
          echo "📅 Date: $(date)"
          echo "🏷️ Tag: prod-$(date +%Y%m%d-%H%M%S)"
