name: Scheduled Production Run

on:
  schedule:
    # Exécution quotidienne à 6h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet l'exécution manuelle

jobs:
  scheduled-run:
    name: Daily Production Refresh
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==1.7.0

      - name: Install dbt packages
        run: |
          cd retail_analytics
          dbt deps

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          retail_analytics:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: dbt_prod
                threads: 16
          EOF

      - name: Run incremental models
        run: |
          cd retail_analytics
          dbt run --select config.materialized:incremental --target prod

      - name: Run full refresh for specific models (weekly)
        if: github.event.schedule == '0 6 * * 0' # Dimanche uniquement
        run: |
          cd retail_analytics
          dbt run --select tag:weekly_refresh --full-refresh --target prod

      - name: Test models
        run: |
          cd retail_analytics
          dbt test --target prod

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scheduled-run-results
          path: retail_analytics/target/run_results.json
          retention-days: 30

      - name: Run summary
        run: |
          echo "✅ Scheduled run completed"
          echo "📅 Date: $(date)"
          echo "⏰ Schedule: Daily at 6:00 UTC"
